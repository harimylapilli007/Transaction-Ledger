services:
  - type: web
    name: transaction-webhook-service
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      # PostgreSQL URI (e.g. Supabase Session pooler); set in the Render dashboard, never committed.
      - key: DATABASE_URL
        sync: false
